# Publishes `brimjs` and `create-brim` on npm when a tag such as v1.0.0 is pushed. It signs in with npm's trusted
# publishing (OIDC), so there is no npm token in the repository: each package names this file as its trusted publisher
# on npmjs.com. Publishing a version that is already there is skipped, so a run that stopped halfway can be run again.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Tools
        run: |
          corepack enable
          npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter brimjs build:editor
      - run: pnpm check-types
      - run: pnpm test
      - run: node scripts/pack-release.mjs "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release"
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          for name in brimjs create-brim; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm."
            else
              npm publish "$RUNNER_TEMP/release/$name-$version.tgz" --access public --tag "$tag"
            fi
          done
